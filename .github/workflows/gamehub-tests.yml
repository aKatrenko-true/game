name: GameHub API tests
on:
  push:
    paths:
      - "gamehub/**"
      - ".github/workflows/gamehub-tests.yml"
  pull_request:
    paths:
      - "gamehub/**"
      - ".github/workflows/gamehub-tests.yml"
  workflow_dispatch:
jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gamehub_test
          POSTGRES_USER: gamehub
          POSTGRES_PASSWORD: gamehub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gamehub -d gamehub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: gamehub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gamehub/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://gamehub:gamehub_test_password@localhost:5432/gamehub_test
        run: python -m pytest -q tests/test_postgres.py

  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamehub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gamehub/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python application and tests
        run: python -m compileall -q app.py tests
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check static/cms.js
          node --check static/cms-public.js
          node --check static/lfg.js
      - name: Run API and CMS regression tests
        run: python -m pytest -q --ignore=tests/test_postgres.py
