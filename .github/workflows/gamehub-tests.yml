name: GameHub API tests
on:
  push:
    paths:
      - "gamehub/**"
      - ".github/workflows/gamehub-tests.yml"
  pull_request:
    paths:
      - "gamehub/**"
      - ".github/workflows/gamehub-tests.yml"
  workflow_dispatch:
jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gamehub
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: gamehub/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run API tests
        run: python -m pytest -q
